[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colorsplit3mf-next"
version = "0.2.0"
description = "No AMS 3MF color/material splitter for separate STL exports"
authors = [
    {name = "Andras Mocsary"},
    {name = "ColorSplit3MF-Next contributors"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
legacy = [
    "trimesh>=3.9.0",
    "numpy>=1.19.0",
]

[project.scripts]
noams-splitter = "noams_splitter:main"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyre]
version = "0.9.18"
source_directories = ["."]
search_path = ["."]
typeshed = "typeshed"
exclude = [
    ".*/__pycache__",
    ".*/output_*",
    ".*/Hinged-Locked-Chest_MultiColor",
]

[tool.pyre.strict]
enabled = true

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ['**/*venv/**\*']

 
